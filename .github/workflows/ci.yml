name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-ci:
    name: Web Build & Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  wpf-ci:
    name: WPF Desktop Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore NuGet dependencies
        run: dotnet restore Yuandl.ModbusAssistant.sln
      - name: Build solution (Release)
        run: dotnet build Yuandl.ModbusAssistant.sln --configuration Release --no-restore
      - name: Run xUnit tests
        run: dotnet test Yuandl.ModbusAssistant.sln --configuration Release --no-build --verbosity normal
